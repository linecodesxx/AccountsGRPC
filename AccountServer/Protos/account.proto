syntax = "proto3";

option csharp_namespace = "AccountContracts";

package account;

service AccountService {
    rpc GetAll(Empty) returns (AccountList);
    rpc GetAccount (AccountRequest) returns (AccountResponse);
    rpc CreateAccount (CreateAccountRequest) returns (AccountResponse);
    rpc UpdateAccount (UpdateAccountRequest) returns (AccountResponse);
    rpc DeleteAccount (AccountRequest) returns (Empty);
}

message AccountList {
  repeated AccountResponse accounts = 1;
}

message Empty {}

message AccountRequest {
    int32 id = 1;
}

message CreateAccountRequest {
    string username = 1;
    string email = 2;
    string password = 3;
    string role = 4;
}

message UpdateAccountRequest {
    int32 id = 1;
    string username = 2;
    string email = 3;
    string password = 4;
    string role = 5;
}

message AccountResponse {
    int32 id = 1;
    string username = 2;
    string email = 3;
    string role = 4;
}